[workspace]
resolver = "2"
members = [
  "crates/tidegate-policy",
  "crates/tidegate-vault",
  "crates/tidegate-daemon",
  "crates/tidegate",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BlueprintLabIO/tidegate"
homepage = "https://tidegate.dev"
authors = ["Blueprint Lab <blueprintlabio@gmail.com>"]

[workspace.dependencies]
tidegate-policy = { path = "crates/tidegate-policy", version = "0.1.0" }
tidegate-vault = { path = "crates/tidegate-vault", version = "0.1.0" }
tidegate-daemon = { path = "crates/tidegate-daemon", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = true
strip = true
