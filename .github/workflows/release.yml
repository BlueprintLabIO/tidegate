name: release

# Build platform binaries and attach them to the GitHub release when a
# v* tag is pushed. The macOS arm64 binary is uploaded from the maintainer's
# machine at tag time; this workflow fills in the other targets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup target add ${{ matrix.target }}
      - name: Cross linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> .cargo/config.toml
      - name: Build
        run: cargo build --release -p tidegate --target ${{ matrix.target }}
      - name: Package
        run: |
          tar -czf tidegate-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release tidegate
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: tidegate-${{ matrix.target }}.tar.gz
